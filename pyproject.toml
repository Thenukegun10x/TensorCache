[build-system]
# hatchling >=1.32 emits Core Metadata 2.5 (PEP 794), which PyPI still rejects;
# pin <1.32 so wheels/sdists build as Metadata 2.4.
requires = ["hatchling >= 1.26, < 1.32"]
build-backend = "hatchling.build"

[project]
name = "tcache"
version = "0.7.0"
description = "Ultra-fast, high-fidelity block-wise INT8 feature & pixel cache engine for ML pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    { name = "TensorCache Authors" }
]
keywords = ["pytorch", "gpu", "compression", "vit", "cnn", "caching", "int8", "quantization", "triton", "cuda", "rocm"]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "pillow>=9.0.0"
]

[project.optional-dependencies]
# Fast entropy only (rANS/tANS hot loops). Much lighter than `fast` when you
# don't need triton/blosc2/safetensors. Without numba the codecs fall back to
# pure Python and are ~50x slower on the CPU.
entropy = [
    "numba>=0.57.0"
]
fast = [
    "triton>=2.0.0; platform_system != 'Windows'",
    "zstandard>=0.20.0",
    "blosc2>=2.0.0",
    "safetensors>=0.4.0",
    "numba>=0.57.0"
]
dev = [
    "pytest>=7.0.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
tensorcache = "tensorcache.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorcache", "src/tcache"]
