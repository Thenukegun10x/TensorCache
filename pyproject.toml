[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorcache"
version = "0.1.0"
description = "Ultra-fast, high-fidelity block-wise INT8 feature & pixel cache engine for ML pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "ML Optimization Team" }
]
keywords = ["pytorch", "gpu", "compression", "vit", "cnn", "caching", "int8", "quantization", "triton", "cuda", "rocm"]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0"
]

[project.optional-dependencies]
fast = [
    "triton>=2.0.0; platform_system != 'Windows'",
    "zstandard>=0.20.0",
    "blosc2>=2.0.0",
    "safetensors>=0.4.0"
]
dev = [
    "pytest>=7.0.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
tensorcache = "tensorcache.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorcache"]
